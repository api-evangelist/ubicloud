aid: ubicloud

name: Ubicloud

description: Ubicloud is an open source cloud that can run anywhere, positioned as an open source alternative to AWS. It provides cloud services
  such as compute (virtual machines), managed PostgreSQL, Kubernetes, GitHub Actions runners and machine images on bare metal providers like Hetzner,
  Leaseweb and AWS Bare Metal, offered as a managed service at console.ubicloud.com or self-hosted. It publishes an API reference and documentation
  at ubicloud.com/docs. Founded by Ozgun Erdogan, Umur Cubukcu and Daniel Farina.

