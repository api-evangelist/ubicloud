overlay: 1.0.0
info:
  title: Ubicloud OpenAPI enhancements (API Evangelist)
  version: 1.0.0
extends: ../openapi/_original/ubicloud-openapi.yml
actions:
- target: $.info
  update:
    x-provider: Ubicloud
    x-api-evangelist:
      generated: '2026-10-09'
      docs: https://www.ubicloud.com/docs/api-reference/overview
      llms_txt: https://www.ubicloud.com/docs/llms.txt
      status_page: https://status.ubicloud.com
- target: $.components.securitySchemes.BearerAuth
  update:
    description: Personal access token created on the project Tokens page in the Ubicloud console, passed in the Authorization header as a Bearer
      token (https://www.ubicloud.com/docs/api-reference/overview).
- target: $.info
  update:
    x-idempotency: Location-based resources have names unique per project and location; the API uses the name in the path as an idempotency token
      for create requests (https://www.ubicloud.com/docs/api-reference/overview).
- target: $.info
  update:
    x-error-codes:
    - status: 403
      meaning: Unauthorized user access
    - status: 419
      meaning: Invalid Token
- target: $.paths['/project/{project_id}'].delete
  update:
    x-agent-hint:
      destructive: true
      confirm_before_calling: true
