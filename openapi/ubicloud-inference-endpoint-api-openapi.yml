openapi: 3.2.0
info:
  title: Ubicloud Inference Endpoint API
  version: 0.1.0
  contact:
    url: https://www.ubicloud.com/
    email: support@ubicloud.com
  license:
    name: GNU Affero General Public License v3.0 (AGPL-3.0)
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  description: 'Operations tagged Inference Endpoint across 2 of this provider''s published API definitions: ubicloud-openapi.yml, ubicloud-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.ubicloud.com
security:
- BearerAuth: []
tags:
- description: Inference Endpoint Operations
  name: Inference Endpoint
paths:
  /project/{project_id}/inference-endpoint:
    parameters:
    - $ref: '#/components/parameters/project_id'
    get:
      operationId: listInferenceEndpoints
      summary: List all inference endpoints
      responses:
        '200':
          $ref: '#/components/responses/InferenceEndpoints'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Inference Endpoint
    servers:
    - url: https://api.ubicloud.com
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: integer
              example: 401
            message:
              type: string
              example: There was an error logging in
            type:
              type: string
              example: InvalidCredentials
            details:
              type:
              - object
              - 'null'
          required:
          - code
          - message
          - type
      additionalProperties: false
      required:
      - error
    InferenceEndpointPrice:
      type: object
      properties:
        per_million_prompt_tokens:
          description: Price per million prompt tokens in USD
          type:
          - number
          - 'null'
        per_million_completion_tokens:
          description: Price per million completion tokens in USD
          type:
          - number
          - 'null'
      additionalProperties: false
      required:
      - per_million_prompt_tokens
      - per_million_completion_tokens
    InferenceEndpoint:
      type: object
      properties:
        id:
          description: ID of the inference endpoint
          type: string
        name:
          description: Name of the model
          type: string
        display_name:
          description: Display name of the model
          type: string
        url:
          description: URL of the inference endpoint
          type: string
        model_name:
          description: Model name of the inference endpoint
          type: string
        tags:
          description: Tags of the inference endpoint
          type: object
        price:
          $ref: '#/components/schemas/InferenceEndpointPrice'
      additionalProperties: false
      required:
      - id
      - name
      - display_name
      - url
      - model_name
      - tags
      - price
  parameters:
    project_id:
      description: ID of the project
      in: path
      name: project_id
      required: true
      schema:
        type: string
        example: pjkkmx0f2vke4h36nk9cm8v8q0
        pattern: ^pj[0-9a-hj-km-np-tv-z]{24}$
  responses:
    InferenceEndpoints:
      description: A list of Inference Endpoints
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/InferenceEndpoint'
            additionalProperties: false
            required:
            - items
    Error:
      description: An error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
x-refined-from:
- ubicloud-openapi.yml
- ubicloud-openapi.yml
